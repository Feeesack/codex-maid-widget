name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node distribution/check-versions.cjs
      - run: npm ci
      # Cold PowerShell/.NET native fixtures share the hosted runner's CPU and
      # compiler resources. Keep every test and its existing timeout, and avoid
      # starting all test files concurrently on the first Windows boot.
      - run: node --test --test-concurrency=1 test/*.test.cjs
      - run: node --test distribution/test/*.test.cjs distribution/integration/test/*.test.cjs
      - name: Prepare hosted Windows display for the full DPI matrix
        run: ./scripts/configure-ci-display.ps1
      - run: npm run smoke
      - run: npm run check:native
      - run: npm run check:drag-dpi
      - run: npm run check:window
      - run: npm run check:follow
      - run: npm run build
      - run: node distribution/windows/build.cjs
      - run: node distribution/windows/test-install.cjs
      - name: Preserve isolated native geometry reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-native-geometry-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            tmp/drag-dpi-check/run-*/summary.json
            tmp/drag-dpi-check/run-*/dpi-*/report.json
            tmp/window-mode-check/run-*/summary.json
            tmp/window-mode-check/run-*/dpi-*/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-installer
          retention-days: 7
          if-no-files-found: error
          path: |
            release/installers/*-windows-x64-setup.exe
            release/installers/*-windows-x64-setup.exe.sha256
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: macos/package-lock.json
      - run: node ../distribution/check-versions.cjs
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run check:native
      - run: npm run check:follow
